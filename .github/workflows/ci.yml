name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Checkout goose engine source
        uses: actions/checkout@v4
        with:
          repository: goose-network/goose
          path: goose-engine

      - uses: actions/setup-go@v5
        with:
          go-version-file: goose-engine/go.mod

      - name: Build the goose engine binary
        env:
          # openrung-go (one of goose's replace-pinned deps) is a private
          # repo: fetch it via authenticated git, not the module proxy.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # The sibling-repo replace directives in goose's go.mod don't
          # exist on a runner. goose's scripts/pin-replacements.sh re-points
          # them at the published pins (single source of truth, kept in
          # sync with goose's own CI and Dockerfile) and runs go mod tidy
          # with the private-repo credentials applied.
          if [ -n "$GH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf https://github.com/
          fi
          cd goose-engine
          scripts/pin-replacements.sh --tidy
          go build -o /tmp/goose-bin ./cmd/goose

      - name: Start goose engine
        run: |
          mkdir -p /tmp/goose-e2e
          cat > /tmp/goose-e2e/config.json <<'JSON'
          {
            "engine": {
              "stack": "system",
              "api": { "listen": "127.0.0.1:9090" },
              "db": "/tmp/goose-e2e/goose.db"
            },
            "inbounds": [
              { "id": "in-http", "protocol": "http", "listen": "127.0.0.1:18080" }
            ],
            "outbounds": [
              { "id": "direct-1", "protocol": "direct", "config": {} }
            ],
            "pools": [
              { "id": "pool-default", "outbound_ids": ["direct-1"], "selector": { "type": "random", "params": {} } }
            ],
            "chains": [
              { "id": "chain-default", "layers": ["pool-default"] }
            ]
          }
          JSON
          /tmp/goose-bin -config /tmp/goose-e2e/config.json &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9090/api/engine > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9090/api/engine > /dev/null

      - name: Build and serve the app
        run: |
          npm ci
          npm run build
          GOOSE_API_URL=http://127.0.0.1:9090 npx vite preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ > /dev/null

      - name: Run Playwright e2e
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
          node e2e/run-e2e.mjs
        env:
          E2E_BASE_URL: http://127.0.0.1:4173

  docker:
    runs-on: ubuntu-latest
    needs: [build-test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: goose-web:ci

      - name: Smoke test the image
        run: |
          docker run -d --name goose-web-smoke -p 8080:8080 \
            -e GOOSE_API_URL=http://172.17.0.1:9090 goose-web:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/ | grep -q '<title>' || {
            echo "::error::index.html not served"; exit 1; }
          curl -sf http://127.0.0.1:8080/inbounds | grep -q '<title>' || {
            echo "::error::SPA fallback broken"; exit 1; }
          docker stop goose-web-smoke

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
